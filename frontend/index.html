<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skydrop</title>
    <style>
      :root {
        --bg: #f4f6f9;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --text: #0f172a;
        --text-muted: #5b6475;
        --border: #b9c3d3;
        --accent: #1d5fc2;
        --accent-hover: #174e9f;
        --accent-soft: #e6eefb;
        --radius: 20px;
        --font: "Space Grotesk", system-ui, sans-serif;
        --front-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        display: flex;
        flex-direction: column;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 24px 32px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
        text-decoration: none;
        font-weight: 700;
        font-size: 30px;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px 64px;
      }
      .card {
        width: 100%;
        max-width: 560px;
        background-color: var(--surface);
        border-radius: var(--radius);
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.06),
          0 12px 32px rgba(15, 23, 42, 0.08);
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .card h1 {
        margin: 0 0 6px;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .subtitle {
        margin: 0;
        font-size: 16px;
        color: var(--text-muted);
      }

      .dropzone {
        border: 2px dashed var(--border);
        border-radius: 16px;
        background: var(--surface-muted);
        padding: 48px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }
      .dropzone-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--accent-soft);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dropzone-title {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
      }
      .dropzone-or {
        margin: 0;
        font-size: 14px;
        color: var(--text-muted);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #ffffff;
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .button:hover {
        background: var(--accent-hover);
      }
      .button-large {
        min-height: 56px;
        border-radius: 12px;
        font-size: 18px;
      }
      .button-secondary {
        background: var (--surface);
        color: var(--text);
        border: 1px solid var(--border-soft);
        font-weight: 500;
        padding: 0 16px;
      }
      .button-secondary:hover {
        background: var(--surface-muted);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .status:empty {
        display: none;
      }
      .status.error {
        color: #b42318;
      }

      .file-header {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .file-icon {
        width: 56px;
        height: 56px;
        flex-shrink: 0;
        border-radius: 14px;
        background: var(--accent-soft);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .file-name {
        margin: 0 0 4px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }
      .file-details {
        margin: 0;
        font-size: 15px;
        color: var(--text-muted);
      }
      .stats {
        margin: 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 12px;
      }
      .stat {
        background: var(--surface-muted);
        border-radius: 12px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .stat dt {
        font-size: 13px;
        color: var(--text-muted);
      }
      .stat dd {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      .share {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .share label {
        font-size: 14px;
        font-weight: 500;
        color: #334155;
      }
      .share-row {
        display: flex;
        gap: 8px;
      }
      .share-row input {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid var(--border-soft);
        border-radius: 10px;
        background: var(--surface-muted);
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 14px;
      }

      @media (max-width: 480px) {
        .card {
          padding: 28px 20px;
        }
        .card h1 {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <a
        id="github_link"
        href="https://github.com/Pybounce/skydrop"
        target="_blank"
        aria-label="GitHub"
        class="logo"
      >
        <svg
          id="github_icon"
          viewBox="0 0 16 16"
          width="27"
          height="27"
          fill="currentColor"
        >
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
      0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52
      -.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2
      -3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21
      2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82
      2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87
      3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0
      .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
      <a class="logo" href="/"> Skydrop </a>
    </header>
    <main>
      <section class="card" id="upload-view" hidden>
        <div>
          <h1>Upload a file</h1>
          <p class="subtitle">
            Upload and recieve a link anyone can download from.
          </p>
        </div>

        <div class="dropzone" id="dropzone">
          <div class="dropzone-icon">
            <svg
              width="30"
              height="30"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#1D5FC2"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 16V4" />
              <path d="M7 9l5-5 5 5" />
              <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
            </svg>
          </div>
          <p class="dropzone-title">Drag a file here</p>
          <p class="dropzone-or">or</p>
          <input class="visually-hidden" type="file" id="file-input" />
          <label class="button" for="file-input">Browse files</label>
        </div>
        <p class="status" id="upload-status" role="status"></p>
      </section>
      <section class="card" id="download-view" hidden>
        <h2 class="status" id="download-status" role="status">Loading...</h2>

        <div id="file-info" hidden>
          <div class="file-header">
            <div class="file-icon">
              <svg
                width="26"
                height="26"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#1D5FC2"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"
                />
                <path d="M14 3v5h5" />
              </svg>
            </div>
            <div>
              <h1 class="file-name" id="file-name"></h1>
              <p class="file-details" id="file-details"></p>
            </div>
          </div>
        </div>
        <d1 class="stats" id="file-stats" hidden>
          <div class="stat">
            <dt>Size</dt>
            <dd id="file-size"></dd>
          </div>
          <div class="stat">
            <dt>Downloads</dt>
            <dd id="file-downloads"></dd>
          </div>
        </d1>

        <a class="button button-large" id="download-button" href="#" hidden>
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 4v12" />
            <path d="M7 11l5 5 5-5" />
            <path d="M4 20h16" />
          </svg>
          Download
        </a>

        <div class="share" id="share" hidden>
          <label for="share-link">Share link</label>
          <div class="share-row">
            <input id="share-link" type="text" readonly />
            <button
              class="button button-secondary"
              type="button"
              id="copy-button"
            >
              Copy
            </button>
          </div>
        </div>
      </section>

      <section class="card" id="not-found-view" hidden>
        <div>
          <h1>Link not found</h1>
          <p class="subtitle">This link has expired or does not exist.</p>
        </div>
        <a class="button" href="/">Send a file</a>
      </section>
    </main>
    <script>
      const API_BASE = "https://api.skydrop.skybounce.io/File";

      const fileId = decodeURIComponent(window.location.pathname.slice(1));
      if (fileId) {
        document.getElementById("download-view").hidden = false;
        loadFile(fileId);
      } else {
        document.getElementById("upload-view").hidden = false;
      }

      // Upload
      const fileInput = document.getElementById("file-input");
      const uploadStatus = document.getElementById("upload-status");

      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        uploadFile(file);
      });

      function uploadFile(file) {
        if (!file) {
          return;
        }

        const xhr = new XMLHttpRequest();
        xhr.open("POST", API_BASE);
        xhr.setRequestHeader("Content-Type", "application/octet-stream");
        xhr.setRequestHeader("X-File-Name", encodeURIComponent(file.name));

        xhr.upload.addEventListener("progress", (event) => {
          if (event.lengthComputable) {
            const progress = Math.round((event.loaded / event.total) * 100);
            showUploadStatus(`Uploading ${file.name} [${percent}%]`);
          }
        });

        xhr.addEventListener("load", () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            const fileId = xhr.responseText.trim();
            window.location.href = "/" + encodeURIComponent(fileId);
          } else if (xhr.status === 413) {
            showUploadError("That file is too large.");
          } else if (xhr.status === 429) {
            showUploadError(
              "The upload limit for Skydrop has been reached. Please try again later.",
            );
          } else {
            showUploadError(
              "Something went wrong uploading your file. Please try again.",
            );
          }
        });

        xhr.addEventListener("error", () => {
          showUploadError("The upload failed. Please try again.");
        });

        fileInput.disabled = true;
        showUploadStatus(`Uploading ${file.name} [0%]`);
        xhr.send(file);
      }

      function showUploadStatus(message) {
        uploadStatus.classList.remove("error");
        uploadStatus.textContent = message;
      }

      function showUploadError(message) {
        uploadStatus.classList.add("error");
        uploadStatus.textContent = message;
        fileInput.disabled = false;
        fileInput.value = "";
      }

      // Download
      const downloadStatus = document.getElementById("download-status");

      async function loadFile(id) {
        let response;
        try {
          response = await fetch(
            `${API_BASE}/Metadata/${encodeURIComponent(id)}`,
          );
        } catch {
          showDownloadError("Could not reach the server.");
          return;
        }

        if (response.status === 404) {
          showNotFound();
          return;
        }

        if (!response.ok) {
          showDownloadError("Something went wrong loading the file.");
        }

        const metadata = await response.json();
        showFile(id, metadata);
      }

      function showFile(id, metadata) {
        document.getElementById("file-name").textContent = metadata.name;
        document.getElementById("file-details").textContent =
          `${fileType(metadata.name)}`;
        document.getElementById("file-downloads").textContent =
          metadata.downloadCount;
        document.getElementById("file-size").textContent = formatBytes(
          metadata.size,
        );

        document.getElementById("download-button").href =
          `${API_BASE}/Download/${encodeURIComponent(id)}`;
        document.getElementById("share-link").value = window.location.href;
        document.title = `${metadata.name} - Skydrop`;

        downloadStatus.textContent = "";
        document.getElementById("file-info").hidden = false;
        document.getElementById("file-stats").hidden = false;
        document.getElementById("download-button").hidden = false;
        document.getElementById("share").hidden = false;
      }

      function showNotFound() {
        document.getElementById("download-view").hidden = true;
        document.getElementById("not-found-view").hidden = false;
      }

      function showDownloadError(message) {
        downloadStatus.classList.add("error");
        downloadStatus.textContent = message;
      }

      const copyButton = document.getElementById("copy-button");
      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(
            document.getElementById("share-link").value,
          );
          copyButton.textContent = "Copied!";
        } catch {
          document.getElementById("share-link").select();
          copyButton.textContent = "Press Ctrl+C";
        }
        setTimeout(() => {
          copyButton.textContent = "Copy";
        }, 2000);
      });

      function formatBytes(bytes) {
        const units = ["bytes", "KB", "MB", "GB", "TB"];
        let value = bytes;
        let unit = 0;
        while (value >= 1000 && unit < units.length - 1) {
          value /= 1000;
          unit += 1;
        }
        const decimals = unit === 0 || value >= 100 ? 0 : 1;
        return `${value.toFixed(decimals)} ${units[unit]}`;
      }

      function fileType(fileName) {
        const dot = fileName.lastIndexOf(".");
        if (dot <= 0 || dot === fileName.length - 1) {
          return "File";
        }
        return `${fileName.slice(dot + 1).toUpperCase()} file`;
      }
    </script>
  </body>
</html>
